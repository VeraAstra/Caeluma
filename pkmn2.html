<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pokémon Type Puzzle Helper</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: #f2f2f2;
      padding: 30px;
    }

    h1 {
      text-align: center;
      color: #ffffff;
    }

    h2 {
      color: #ffffff;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 24px;
      max-width: 1300px;
      margin: 0 auto;
    }

    .panel {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .type-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .type-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border-radius: 8px;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, opacity 0.2s;
    }

    .type-option:hover {
      background: #333333;
    }

    .type-option.eliminated {
      color: #777;
      text-decoration: line-through;
      opacity: 0.65;
      background: #181818;
    }

    .type-option.required {
      border-color: #7dd3fc;
      background: #143244;
    }

    input[type="checkbox"] {
      accent-color: #7dd3fc;
      cursor: pointer;
    }

    .remaining-list,
    .combo-list {
      padding-left: 20px;
      max-height: 500px;
      overflow-y: auto;
    }

    .remaining-list li,
    .combo-list li {
      margin-bottom: 6px;
    }

    .count {
      color: #aaa;
      font-size: 0.9rem;
      margin-top: -8px;
      margin-bottom: 14px;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    button {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #7dd3fc;
      color: #121212;
      font-weight: bold;
    }

    button:hover {
      background: #38bdf8;
    }

    .small-note {
      color: #aaa;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    @media (max-width: 1000px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <h1>Pokémon Type Puzzle Helper</h1>

  <div class="layout">
    <section class="panel">
      <h2>Eliminate Types</h2>
      <p class="small-note">Check types that are impossible.</p>

      <div id="eliminateGrid" class="type-grid"></div>

      <div class="controls">
        <button id="resetEliminatedButton">Reset Eliminated</button>
      </div>
    </section>

    <section class="panel">
      <h2>Required Types</h2>
      <p class="small-note">Check types the Pokémon must include.</p>

      <div id="requiredGrid" class="type-grid"></div>

      <div class="controls">
        <button id="resetRequiredButton">Reset Required</button>
      </div>
    </section>

    <section class="panel">
      <h2>Remaining Choices</h2>
      <p id="remainingCount" class="count"></p>

      <ul id="remainingList" class="remaining-list"></ul>

      <h2>Possible Type Combinations</h2>
      <p id="comboCount" class="count"></p>

      <ul id="comboList" class="combo-list"></ul>

      <div class="controls">
        <button id="resetAllButton">Reset Everything</button>
      </div>
    </section>
  </div>

  <script>
    const pokemonTypes = [
      "Normal",
      "Fire",
      "Water",
      "Electric",
      "Grass",
      "Ice",
      "Fighting",
      "Poison",
      "Ground",
      "Flying",
      "Psychic",
      "Bug",
      "Rock",
      "Ghost",
      "Dragon",
      "Dark",
      "Steel",
      "Fairy"
    ];

    const eliminatedTypes = [];
    const requiredTypes = [];

    const eliminateGrid = document.getElementById("eliminateGrid");
    const requiredGrid = document.getElementById("requiredGrid");
    const remainingList = document.getElementById("remainingList");
    const comboList = document.getElementById("comboList");
    const remainingCount = document.getElementById("remainingCount");
    const comboCount = document.getElementById("comboCount");

    const resetEliminatedButton = document.getElementById("resetEliminatedButton");
    const resetRequiredButton = document.getElementById("resetRequiredButton");
    const resetAllButton = document.getElementById("resetAllButton");

    function buildEliminateCheckboxes() {
      eliminateGrid.innerHTML = "";

      pokemonTypes.forEach(function(type) {
        const label = document.createElement("label");
        label.className = "type-option";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = type;
        checkbox.dataset.type = type;
        checkbox.className = "eliminate-checkbox";

        const span = document.createElement("span");
        span.textContent = type;

        checkbox.addEventListener("change", function() {
          if (checkbox.checked) {
            addToArray(eliminatedTypes, type);
            label.classList.add("eliminated");

            removeFromArray(requiredTypes, type);
            uncheckRequiredBox(type);
          } else {
            removeFromArray(eliminatedTypes, type);
            label.classList.remove("eliminated");
          }

          updateDisplay();
        });

        label.appendChild(checkbox);
        label.appendChild(span);

        eliminateGrid.appendChild(label);
      });
    }

    function buildRequiredCheckboxes() {
      requiredGrid.innerHTML = "";

      pokemonTypes.forEach(function(type) {
        const label = document.createElement("label");
        label.className = "type-option";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = type;
        checkbox.dataset.type = type;
        checkbox.className = "required-checkbox";

        const span = document.createElement("span");
        span.textContent = type;

        checkbox.addEventListener("change", function() {
          if (checkbox.checked) {
            addToArray(requiredTypes, type);
            label.classList.add("required");

            removeFromArray(eliminatedTypes, type);
            uncheckEliminateBox(type);
          } else {
            removeFromArray(requiredTypes, type);
            label.classList.remove("required");
          }

          updateDisplay();
        });

        label.appendChild(checkbox);
        label.appendChild(span);

        requiredGrid.appendChild(label);
      });
    }

    function addToArray(array, value) {
      if (!array.includes(value)) {
        array.push(value);
      }
    }

    function removeFromArray(array, value) {
      const index = array.indexOf(value);

      if (index !== -1) {
        array.splice(index, 1);
      }
    }

    function uncheckEliminateBox(type) {
      const checkbox = document.querySelector(".eliminate-checkbox[data-type='" + type + "']");

      if (checkbox) {
        checkbox.checked = false;
        checkbox.parentElement.classList.remove("eliminated");
      }
    }

    function uncheckRequiredBox(type) {
      const checkbox = document.querySelector(".required-checkbox[data-type='" + type + "']");

      if (checkbox) {
        checkbox.checked = false;
        checkbox.parentElement.classList.remove("required");
      }
    }

    function getRemainingTypes() {
      return pokemonTypes.filter(function(type) {
        return !eliminatedTypes.includes(type);
      });
    }

    function getTypeCombinations(remainingTypes) {
      const combinations = [];

      for (let i = 0; i < remainingTypes.length; i++) {
        for (let j = i + 1; j < remainingTypes.length; j++) {
          const firstType = remainingTypes[i];
          const secondType = remainingTypes[j];

          const includesEveryRequiredType = requiredTypes.every(function(requiredType) {
            return firstType === requiredType || secondType === requiredType;
          });

          if (includesEveryRequiredType) {
            combinations.push(firstType + " / " + secondType);
          }
        }
      }

      return combinations;
    }

    function updateDisplay() {
      const remainingTypes = getRemainingTypes();
      const combinations = getTypeCombinations(remainingTypes);

      remainingList.innerHTML = "";
      comboList.innerHTML = "";

      remainingCount.textContent = remainingTypes.length + " type(s) remaining";
      comboCount.textContent = combinations.length + " combination(s) possible";

      remainingTypes.forEach(function(type) {
        const listItem = document.createElement("li");
        listItem.textContent = type;
        remainingList.appendChild(listItem);
      });

      combinations.forEach(function(combo) {
        const listItem = document.createElement("li");
        listItem.textContent = combo;
        comboList.appendChild(listItem);
      });

      if (remainingTypes.length === 0) {
        const listItem = document.createElement("li");
        listItem.textContent = "No types left.";
        remainingList.appendChild(listItem);
      }

      if (combinations.length === 0) {
        const listItem = document.createElement("li");

        if (requiredTypes.length > 2) {
          listItem.textContent = "No combinations left. A Pokémon can only have up to two types.";
        } else {
          listItem.textContent = "No combinations left.";
        }

        comboList.appendChild(listItem);
      }
    }

    function resetEliminated() {
      eliminatedTypes.length = 0;

      const checkboxes = document.querySelectorAll(".eliminate-checkbox");

      checkboxes.forEach(function(checkbox) {
        checkbox.checked = false;
        checkbox.parentElement.classList.remove("eliminated");
      });

      updateDisplay();
    }

    function resetRequired() {
      requiredTypes.length = 0;

      const checkboxes = document.querySelectorAll(".required-checkbox");

      checkboxes.forEach(function(checkbox) {
        checkbox.checked = false;
        checkbox.parentElement.classList.remove("required");
      });

      updateDisplay();
    }

    function resetAll() {
      resetEliminated();
      resetRequired();
      updateDisplay();
    }

    resetEliminatedButton.addEventListener("click", resetEliminated);
    resetRequiredButton.addEventListener("click", resetRequired);
    resetAllButton.addEventListener("click", resetAll);

    buildEliminateCheckboxes();
    buildRequiredCheckboxes();
    updateDisplay();
  </script>
</body>
</html>
