<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Website</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #f5f5f5;
    }

    .navbar {
      background-color: #1f1f1f;
      padding: 15px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #333;
    }

    .logo {
      color: #ffffff;
      font-size: 24px;
      text-decoration: none;
    }

    .menu {
      list-style: none;
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
    }

    .menu li a {
      color: #f5f5f5;
      text-decoration: none;
      font-size: 16px;
    }

    .menu li a:hover {
      color: #9ad0ff;
    }

    .hero {
      text-align: center;
      padding: 100px 20px;
      background-color: #181818;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 10px;
      color: #ffffff;
    }

    .hero p {
      font-size: 20px;
      color: #cfcfcf;
    }

    .content {
      padding: 40px;
      text-align: center;
      background-color: #121212;
    }

    .content h2 {
      color: #ffffff;
    }

    .content p {
      color: #cfcfcf;
    }
  </style>
</head>

<body>
  <nav class="navbar">
    <a href="#" class="logo">My Website</a>

    <ul class="menu">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Contact</a></li>

      <!-- Add more menu items here later -->
      <!-- Example: <li><a href="#">Blog</a></li> -->
    </ul>
  </nav>

  <section class="hero">
    <h1>Welcome to My Website</h1>
    <p>This is a simple dark mode homepage you can build on later.</p>
  </section>

  <section class="content">
    <h2>About This Site</h2>
    <p>You can add more sections, pages, images, and links as your website grows.</p>
  </section>
</body>
</html>
